[project]
name = "lemmaTEIbrowser"
version = "0.2.0"
description = "A Flask application for browsing and querying lemmatized TEI XML texts"
requires-python = ">=3.9"

dependencies = [
    "flask>=3.0.0",
    "sqlalchemy>=2.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
]

[tool.setuptools.packages.find]
include = ["lemmaTEIbrowser"]

[project.scripts]
lemma-import = "lemmaTEIbrowser.cli:import_tei"
lemma-serve = "lemmaTEIbrowser.cli:serve"

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"