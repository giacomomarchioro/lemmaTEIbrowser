<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEI Lemma Browser - Vista Lista</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Crimson Text', 'Georgia', serif;
            line-height: 1.6;
            color: #2c3e50;
            background: #faf9f7;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 40px 50px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        h1 {
            font-family: 'Georgia', serif;
            font-size: 2.5em;
            font-weight: 400;
            color: #1a1a1a;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.1em;
            color: #666;
            font-style: italic;
            margin-bottom: 40px;
        }

        /* Search Panel */
        .search-panel {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 4px;
            margin-bottom: 40px;
            border: 1px solid #e1e4e8;
        }

        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        input, select {
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 3px;
            font-size: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4a5568;
        }

        #search-query {
            flex: 2;
        }

        #search-type {
            flex: 1;
        }

        .filter-row input {
            flex: 1;
        }

        button {
            padding: 10px 24px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: background 0.2s;
        }

        button:hover {
            background: #1a252f;
        }

        #clear-btn {
            background: #95a5a6;
        }

        #clear-btn:hover {
            background: #7f8c8d;
        }

        /* Stats Bar */
        .stats-bar {
            padding: 15px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid #e1e4e8;
            color: #666;
            font-size: 0.95em;
        }

        .stats-bar strong {
            color: #2c3e50;
        }

        /* Entry List */
        .entry-list {
            margin-bottom: 40px;
        }

        .entry {
            margin-bottom: 35px;
            padding-bottom: 30px;
            border-bottom: 1px solid #e8e8e8;
        }

        .entry:last-child {
            border-bottom: none;
        }

        /* Headword */
        .headword {
            font-size: 1.4em;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .headword .occurrence {
            color: #2c3e50;
        }

        .headword .lemma {
            font-size: 0.85em;
            color: #666;
            font-weight: 400;
            font-style: italic;
            margin-left: 8px;
        }

        .headword .lemma::before {
            content: "< ";
        }

        /* Type badge */
        .type-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 3px;
            font-size: 0.7em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 10px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .type-badge.word {
            background: #e3f2fd;
            color: #1565c0;
        }

        .type-badge.phraseme {
            background: #e8f5e9;
            color: #2e7d32;
        }

        /* Context */
        .context {
            font-size: 1.05em;
            line-height: 1.8;
            margin: 12px 0;
            text-align: justify;
            color: #333;
        }

        .context .highlight {
            font-weight: 700;
            color: #000;
            background: linear-gradient(180deg, transparent 65%, #fff3cd 65%);
            padding: 0 2px;
        }

        /* Metadata */
        .metadata {
            margin-top: 10px;
            padding-top: 10px;
            font-size: 0.9em;
            color: #666;
        }

        .metadata-row {
            margin-bottom: 4px;
        }

        .metadata-label {
            display: inline-block;
            width: 90px;
            font-weight: 600;
            color: #555;
        }

        .metadata-value {
            color: #666;
        }

        .source {
            font-style: italic;
            color: #555;
        }

        .source-link {
            display: inline-block;
            margin-left: 8px;
            color: #1565c0;
            text-decoration: none;
            font-size: 0.9em;
            border-bottom: 1px dotted #1565c0;
        }

        .source-link:hover {
            border-bottom-style: solid;
        }

        .source-link::before {
            content: "→ ";
        }

        .concept-link {
            color: #1565c0;
            text-decoration: none;
            border-bottom: 1px dotted #1565c0;
        }

        .concept-link:hover {
            border-bottom-style: solid;
        }

        .xml-id {
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            color: #888;
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 2px;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 40px 0 20px 0;
            padding: 20px 0;
            border-top: 1px solid #e8e8e8;
        }

        .pagination button {
            padding: 8px 16px;
            background: #ecf0f1;
            color: #2c3e50;
        }

        .pagination button:hover:not(:disabled) {
            background: #bdc3c7;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 0.95em;
            color: #666;
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-style: italic;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 2em;
            }

            .search-row {
                flex-direction: column;
            }

            .metadata-label {
                display: block;
                margin-bottom: 2px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lemma Browser</h1>
        <p class="subtitle">Dizionario delle occorrenze nei testi poetici</p>
        
        <div class="search-panel">
            <div class="search-row">
                <input type="text" id="search-query" placeholder="Cerca parola, lemma, frasema o concetto...">
                <select id="search-type">
                    <option value="lemma">Lemma</option>
                    <option value="occurrence">Occorrenza</option>
                    <option value="phraseme">Frasema (forma norm.)</option>
                    <option value="concept">Concetto</option>
                    <option value="alternativeLabel">Lemma + Frasema</option>
                </select>
            </div>
            
            <div class="search-row filter-row">
                <input type="text" id="concept-id" placeholder="Concept ID">
                <input type="date" id="filter-notBefore" placeholder="Da">
                <input type="date" id="filter-notAfter" placeholder="A">
                <input type="text" id="filter-text-ids" placeholder="Text IDs (1,2,3)">
            </div>
            
            <div class="search-row">
                <button id="search-btn">Cerca</button>
                <button id="clear-btn">Pulisci</button>
            </div>
        </div>
        
        <div id="stats-bar" class="stats-bar" style="display: none;"></div>
        
        <div id="results"></div>
        
        <div id="pagination" class="pagination" style="display: none;">
            <button id="prev-btn">← Precedente</button>
            <span class="page-info" id="page-info"></span>
            <button id="next-btn">Successiva →</button>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;
        let currentParams = {};

        // Initialize from URL parameters on page load
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // Populate form fields from URL
            if (urlParams.has('q')) {
                document.getElementById('search-query').value = urlParams.get('q');
            }
            if (urlParams.has('type')) {
                document.getElementById('search-type').value = urlParams.get('type');
            }
            if (urlParams.has('concept_id')) {
                document.getElementById('concept-id').value = urlParams.get('concept_id');
            }
            if (urlParams.has('notBefore')) {
                document.getElementById('filter-notBefore').value = urlParams.get('notBefore');
            }
            if (urlParams.has('notAfter')) {
                document.getElementById('filter-notAfter').value = urlParams.get('notAfter');
            }
            if (urlParams.has('text_id')) {
                document.getElementById('filter-text-ids').value = urlParams.get('text_id');
            }
            if (urlParams.has('page')) {
                currentPage = parseInt(urlParams.get('page'));
            }
            
            // Perform search if query parameters exist
            if (urlParams.has('q') || urlParams.has('concept_id')) {
                performSearch();
            }
        });

        // Search button click
        document.getElementById('search-btn').addEventListener('click', function() {
            currentPage = 1;
            performSearch();
        });

        // Clear button
        document.getElementById('clear-btn').addEventListener('click', function() {
            document.getElementById('search-query').value = '';
            document.getElementById('concept-id').value = '';
            document.getElementById('search-type').value = 'lemma';
            document.getElementById('filter-notBefore').value = '';
            document.getElementById('filter-notAfter').value = '';
            document.getElementById('filter-text-ids').value = '';
            document.getElementById('results').innerHTML = '';
            document.getElementById('stats-bar').style.display = 'none';
            document.getElementById('pagination').style.display = 'none';
        });

        // Enter key to search
        document.getElementById('search-query').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                currentPage = 1;
                performSearch();
            }
        });

        document.getElementById('concept-id').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                currentPage = 1;
                performSearch();
            }
        });

        // Pagination buttons
        document.getElementById('prev-btn').addEventListener('click', function() {
            if (currentPage > 1) {
                currentPage--;
                performSearch();
                window.scrollTo(0, 0);
            }
        });

        document.getElementById('next-btn').addEventListener('click', function() {
            if (currentPage < totalPages) {
                currentPage++;
                performSearch();
                window.scrollTo(0, 0);
            }
        });

        function performSearch() {
            const searchQuery = document.getElementById('search-query').value;
            const conceptId = document.getElementById('concept-id').value;

            // Build URL parameters
            const params = new URLSearchParams({
                page: currentPage,
                size: 20,
                type: document.getElementById('search-type').value,
                notBefore: document.getElementById('filter-notBefore').value,
                notAfter: document.getElementById('filter-notAfter').value,
                text_id: document.getElementById('filter-text-ids').value
            });

            // Priority to concept_id
            if (conceptId) {
                params.set('concept_id', conceptId);
            } else if (searchQuery) {
                params.set('q', searchQuery);
            } else {
                return;
            }

            // Remove empty parameters
            for (let [key, value] of Array.from(params.entries())) {
                if (!value) params.delete(key);
            }

            currentParams = Object.fromEntries(params);

            // Update browser URL without reload
            const newUrl = `${window.location.pathname}?${params.toString()}`;
            window.history.pushState({}, '', newUrl);

            // Show loading
            document.getElementById('results').innerHTML = '<div class="loading">Caricamento</div>';

            // Fetch results
            fetch(`/api/v1/occurrences?${params.toString()}`)
                .then(response => response.json())
                .then(data => {
                    displayResults(data);
                })
                .catch(error => {
                    document.getElementById('results').innerHTML = 
                        '<div class="empty-state">Errore nel caricamento dei dati</div>';
                    console.error('Error:', error);
                });
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            const statsBar = document.getElementById('stats-bar');
            const pagination = document.getElementById('pagination');

            if (!data.data || data.data.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📖</div>
                        <p>Nessun risultato trovato</p>
                    </div>
                `;
                statsBar.style.display = 'none';
                pagination.style.display = 'none';
                return;
            }

            // Update stats
            statsBar.innerHTML = `
                <strong>Risultati:</strong> ${data.total_results} occorrenze trovate
                <strong style="margin-left: 20px;">Pagina:</strong> ${data.current_page} di ${data.last_page}
            `;
            statsBar.style.display = 'block';

            // Update pagination
            totalPages = data.last_page;
            document.getElementById('page-info').textContent = `Pagina ${currentPage} di ${totalPages}`;
            document.getElementById('prev-btn').disabled = currentPage <= 1;
            document.getElementById('next-btn').disabled = currentPage >= totalPages;
            pagination.style.display = 'flex';

            // Build entries HTML
            let html = '<div class="entry-list">';

            data.data.forEach(item => {
                html += buildEntry(item);
            });

            html += '</div>';
            resultsDiv.innerHTML = html;
        }

        function buildEntry(item) {
            const isPhraseme = item.type === 'phraseme';
            const headword = item.occurrence;
            const lemma = isPhraseme ? item.normalized_form : item.lemma;
            const context = highlightOccurrence(item.context, item.occurrence);
            
            let html = '<div class="entry">';
            
            // Headword
            html += '<div class="headword">';
            html += `<span class="occurrence">${headword}</span>`;
            if (lemma) {
                html += `<span class="lemma">${lemma}</span>`;
            }
            html += `<span class="type-badge ${item.type}">${isPhraseme ? 'frasema' : 'parola'}</span>`;
            html += '</div>';
            
            // Context
            if (context) {
                html += `<div class="context">${context}</div>`;
            }
            
            // Metadata
            html += '<div class="metadata">';
            
            // Source with link to full text
            html += '<div class="metadata-row">';
            html += '<span class="metadata-label">Fonte:</span>';
            html += `<span class="source">${item.text.author}, <em>${item.text.title}</em>`;
            if (item.text.notBefore || item.text.notAfter) {
                const dates = [item.text.notBefore, item.text.notAfter].filter(d => d).join(' – ');
                html += ` (${dates})`;
            }
            html += '</span>';
            
            // Add link to full text if sourceFile exists
            if (item.text.sourceFile && item.xml_id) {
                const xmlId = Array.isArray(item.xml_id) ? item.xml_id[0] : item.xml_id;
                const textUrl = `/static/texts/${item.text.sourceFile}.tei.html?w=${xmlId}`;
                html += `<a href="${textUrl}" class="source-link" target="_blank">Vedi nel testo</a>`;
            }
            
            html += '</div>';
            
            // Concept
            if (item.concept && item.concept.url) {
                html += '<div class="metadata-row">';
                html += '<span class="metadata-label">Concetto:</span>';
                const conceptLabel = item.concept.url.split('/').pop();
                html += `<a href="${item.concept.url}" class="concept-link" target="_blank">${conceptLabel}</a>`;
                html += '</div>';
            }
            
            // XML ID
            if (item.xml_id) {
                html += '<div class="metadata-row">';
                html += '<span class="metadata-label">XML ID:</span>';
                if (Array.isArray(item.xml_id)) {
                    html += item.xml_id.map(id => `<span class="xml-id">${id}</span>`).join(' ');
                } else {
                    html += `<span class="xml-id">${item.xml_id}</span>`;
                }
                html += '</div>';
            }
            
            html += '</div>'; // close metadata
            html += '</div>'; // close entry
            
            return html;
        }

        function highlightOccurrence(context, occurrence) {
            if (!context || !occurrence) return context;
            
            // Escape special regex characters
            const escapedOccurrence = occurrence.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            
            // Create regex for case-insensitive match
            const regex = new RegExp(`\\b(${escapedOccurrence})\\b`, 'gi');
            
            return context.replace(regex, '<span class="highlight">$1</span>');
        }
    </script>
</body>
</html>
